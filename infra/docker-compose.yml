version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tongxing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tongxing
      POSTGRES_PASSWORD: tongxing_pwd
      POSTGRES_DB: tongxing
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tongxing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
