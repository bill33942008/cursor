<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同行后台管理系统</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="login-panel" class="panel visible">
        <h1>同行后台管理系统</h1>
        <p class="muted">请使用管理员账号登录</p>
        <form id="login-form">
          <label>
            用户名
            <input id="username" type="text" autocomplete="username" required />
          </label>
          <label>
            密码
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">登录</button>
          <p id="login-error" class="error"></p>
        </form>
      </section>

      <section id="dashboard-panel" class="panel">
        <header class="dashboard-header">
          <div>
            <h1>管理控制台</h1>
            <p id="admin-meta" class="muted"></p>
          </div>
          <div class="header-actions">
            <button id="refresh-btn">刷新</button>
            <button id="change-password-btn">修改密码</button>
            <button id="logout-btn" class="danger">退出登录</button>
          </div>
        </header>

        <div class="dashboard-shell">
          <aside class="menu-sidebar">
            <div class="menu-group-label">总览</div>
            <button class="menu-item-btn active" data-panel-target="overview">运营概览</button>
            <button class="menu-item-btn" data-panel-target="feature-flags">功能开关中心</button>

            <div class="menu-group-label">治理</div>
            <button class="menu-item-btn" data-panel-target="users">用户管理</button>
            <button class="menu-item-btn" data-panel-target="media">媒体审核</button>
            <button class="menu-item-btn" data-panel-target="posts">动态审核</button>
            <button class="menu-item-btn" data-panel-target="reports">举报处理</button>
          </aside>

          <main class="dashboard-main">
            <div class="cards" id="stats-cards"></div>

            <section class="content-panel visible" data-panel="overview">
              <div class="overview-banner">
                <h3>运营状态概览</h3>
                <p class="muted">查看实时核心数据，并快速切换 Mock 测试数据。</p>
              </div>
              <section class="mock-setting">
                <div>
                  <h3>测试数据开关</h3>
                  <p class="muted">开启后会注入模拟用户、动态和群组数据，便于联调与演示。</p>
                </div>
                <label class="switch-inline">
                  <input id="mock-data-toggle" type="checkbox" />
                  <span id="mock-data-label">关闭</span>
                </label>
              </section>
              <section class="card-simple">
                <h3>当前阶段</h3>
                <p id="overview-stage" class="muted">读取中...</p>
              </section>
            </section>

            <section class="content-panel" data-panel="feature-flags">
              <div class="section-head">
                <div>
                  <h3>阶段预设</h3>
                  <p id="feature-stage-meta" class="muted">读取中...</p>
                </div>
                <div class="preset-actions" id="preset-actions"></div>
              </div>

              <div class="card-simple">
                <div class="panel-actions">
                  <input id="flag-keyword" placeholder="搜索开关键、页面、按钮、说明" />
                  <select id="flag-module-filter">
                    <option value="all">全部模块</option>
                  </select>
                  <button id="load-flags-btn">查询</button>
                </div>
                <table>
                  <thead>
                    <tr>
                      <th>模块</th>
                      <th>页面/控件</th>
                      <th>开关键</th>
                      <th>说明</th>
                      <th>状态</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="feature-flags-body"></tbody>
                </table>
              </div>

              <div class="card-simple">
                <h3>开关操作日志</h3>
                <table>
                  <thead>
                    <tr>
                      <th>时间</th>
                      <th>动作</th>
                      <th>目标</th>
                      <th>管理员</th>
                      <th>详情</th>
                    </tr>
                  </thead>
                  <tbody id="feature-audit-body"></tbody>
                </table>
              </div>
            </section>

            <section class="content-panel" data-panel="users">
              <div class="panel-actions">
                <input id="user-keyword" placeholder="搜索用户昵称/ID" />
                <select id="user-status">
                  <option value="all">全部用户</option>
                  <option value="active">正常用户</option>
                  <option value="banned">封禁用户</option>
                </select>
                <button id="load-users-btn">查询</button>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>用户</th>
                    <th>状态</th>
                    <th>身份与VIP权限</th>
                    <th>最近活跃</th>
                    <th>注册时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="users-body"></tbody>
              </table>
            </section>

            <section class="content-panel" data-panel="media">
              <div class="panel-actions">
                <select id="media-status">
                  <option value="review">待审核</option>
                  <option value="approved">已通过</option>
                  <option value="rejected">已拒绝</option>
                  <option value="all">全部</option>
                </select>
                <button id="load-media-btn">查询</button>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>资源</th>
                    <th>上传者</th>
                    <th>类型</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="media-body"></tbody>
              </table>
            </section>

            <section class="content-panel" data-panel="posts">
              <div class="panel-actions">
                <select id="post-status">
                  <option value="review">待审核</option>
                  <option value="approved">已通过</option>
                  <option value="rejected">已拒绝</option>
                  <option value="all">全部</option>
                </select>
                <button id="load-posts-btn">查询</button>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>内容</th>
                    <th>用户</th>
                    <th>状态</th>
                    <th>发布时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="posts-body"></tbody>
              </table>
            </section>

            <section class="content-panel" data-panel="reports">
              <div class="panel-actions">
                <select id="report-status">
                  <option value="open">待处理</option>
                  <option value="resolved">已解决</option>
                  <option value="dismissed">已忽略</option>
                  <option value="all">全部</option>
                </select>
                <button id="load-reports-btn">查询</button>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>举报对象</th>
                    <th>原因</th>
                    <th>状态</th>
                    <th>处理人</th>
                    <th>创建时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="reports-body"></tbody>
              </table>
            </section>
          </main>
        </div>
      </section>
    </div>
    <script src="/admin/app.js"></script>
  </body>
</html>
